name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run unit tests
        run: python manage.py test -v 2

  docker:
    name: Build image and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build and start the service
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Smoke test against the real upstream
        run: curl -fs http://localhost:8000/posts/1

      - name: Stop the service
        if: always()
        run: docker compose down
